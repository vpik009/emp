datamodule:
  _target_: src.datamodule.av2_datamodule.Av2DataModule
  data_root: ${data_root}
  data_folder: ${model.name}
  train_batch_size: ${batch_size}
  val_batch_size: ${batch_size}
  test_batch_size: ${batch_size}
  shuffle: true
  num_workers: ${num_workers}
  pin_memory: true
  train_fraction: 0.25
model:
  name: emp
  phase: forecast
  target:
    _target_: src.model.trainer_forecast.Trainer
    dim: 64
    historical_steps: 50
    future_steps: 60
    encoder_depth: 2
    num_heads: 8
    mlp_ratio: 2.0
    qkv_bias: false
    drop_path: 0.2
    pretrained_weights: ${pretrained_weights}
    lr: ${lr}
    weight_decay: ${weight_decay}
    epochs: ${epochs}
    warmup_epochs: ${warmup_epochs}
    decoder: detr
seed: 2333
monitor: val_minFDE6
save_top_k: 10
data_root: data
checkpoint: null
pretrained_weights: null
dm: av2
output: ${model.name}-${model.phase}_${dm}
num_workers: 0
gpus: 1
sync_bn: true
batch_size: 48
epochs: 60
warmup_epochs: 10
lr: 0.001
weight_decay: 0.0001
gradient_clip_val: 3
gradient_clip_algorithm: norm
limit_train_batches: null
limit_val_batches: null
limit_test_batches: null
log_model: all
test: false
wandb: disable
